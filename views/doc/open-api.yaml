openapi: 3.0.0
info:
  title: API-DOG
  version: 1.0.0
servers:
  - url: http://{{url}}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Access
  - name: Access > Client
  - name: Access > Role
  - name: Access > Permission
  - name: User
  - name: Category
  - name: Product
  - name: Cart
  - name: Order
  - name: Review
paths:

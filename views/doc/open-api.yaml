    get:
      tags:
        - Auth
      summary: Home
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /send/otp:
    post:
      tags:
        - Auth
      summary: SendOTP
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                email: dimas@gmail.com
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /account/register:
    post:
      tags:
        - Auth
      summary: Register
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                name: dimas
                email: dimas@gmail.com
                password: '12345679'
                otp: 6VH5950
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /login:
    post:
      tags:
        - Auth
      summary: Login

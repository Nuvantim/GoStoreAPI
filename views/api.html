<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ .Title }}</title>
</head>
<body>
  <div id="app"></div>

  <script src="/dist/scallar.js"></script>
  <script>
    Scalar.createApiReference('#app', {
      url: 'doc/open-api.yaml',
      theme: 'bluePlanet',
      telemetry: false,
      hideClientButton: true,
      agent:{
        disabled: true,
      }
      darkMode: true,
      servers: [
        {
          url: "{{ .APIBaseURL }}",
          description: "API Server"
        }
      ]
    });
  </script>
</body>
</html>
